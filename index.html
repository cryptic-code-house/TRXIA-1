<!doctype html>
<html lang="en" class="scroll-smooth bg-[#080707] text-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080707" />
    <meta name="description" content="TRXIA - Emergency lifeline network for critical battery thresholds. Small signal. Big reach. Almost no battery." />
    <title>TRXIA | When the battery fades, the alert doesn't.</title>
    
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Michroma, Exo 2, Figtree, Plus Jakarta Sans -->
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=Figtree:ital,wght@0,300..900;1,300..900&family=Michroma&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/assets/trxia-logo.png" />
  </head>
  <body class="bg-[#080707] text-[#EDEAE7] font-figtree antialiased selection:bg-[#FF5E0E]/30 selection:text-white min-h-[100dvh] overflow-x-hidden">
    <div id="root"></div>

    <!-- Fallback guard when opened directly via file:// instead of http://localhost:3000 -->
    <script>
      if (window.location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #070606; color: #EDEAE7; text-align: center; padding: 24px;">' +
              '<div style="max-width: 520px; background: rgba(28, 20, 18, 0.75); border: 1px solid rgba(255, 120, 36, 0.4); border-radius: 28px; padding: 36px 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.9); backdrop-filter: blur(20px);">' +
              '<div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(255, 94, 14, 0.15); border: 1px solid rgba(255, 94, 14, 0.5); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 26px;">⚡</div>' +
              '<h2 style="font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #FFFFFF; letter-spacing: -0.02em;">TRXIA Local Server Required</h2>' +
              '<p style="font-size: 14px; color: #B3ABA5; line-height: 1.6; margin-bottom: 26px;">Modern React + TypeScript applications require a local web server to run and cannot be opened via <code>file:///</code> due to browser security policies.</p>' +
              '<a href="http://localhost:3000" style="display: inline-block; background: linear-gradient(180deg, #FF7824 0%, #DC4B05 100%); color: #FFFFFF; font-weight: 600; font-size: 14px; padding: 14px 30px; border-radius: 9999px; text-decoration: none; box-shadow: 0 10px 28px rgba(255, 94, 14, 0.45); transition: transform 0.2s;">Open http://localhost:3000 &rarr;</a>' +
              '<p style="font-size: 12px; color: #736B66; margin-top: 22px;">Tip: You can also double-click <strong>"Launch TRXIA Website.bat"</strong> on your Desktop.</p>' +
              '</div></div>';
          }
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
